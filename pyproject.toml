[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "octolearn"
version = "0.7.0"
description = "Structured AutoML Pipeline with Intelligent Dataset Profiling"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Ghulam Muhammad Nabeel", email = "ghulam.nabeel@example.com"}
]
keywords = ["automl", "machine-learning", "data-science", "profiling", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=1.0.0",
    "numpy>=1.19.0",
    "scikit-learn>=0.24.0",
    "optuna>=2.0.0",
    "reportlab>=3.6.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "shap>=0.40.0",
]

[project.optional-dependencies]
distributed = [
    "dask[complete]>=2021.9.0",
    "ray[default]>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/GhulamMuhammadNabeel/Octolearn"
"Bug Tracker" = "https://github.com/GhulamMuhammadNabeel/Octolearn"
Documentation = "https://github.com/GhulamMuhammadNabeel/Octolearn"
